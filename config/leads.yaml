# Freelance leads: people or companies that may need your services.
# Run with `npm run leads`; they are emailed separately from the job digest.

# Drop leads older than this many days.
max_age_days: 2

# For Reddit, Hacker News, X and LinkedIn posts, a lead must ask for help close to a
# service. Regex fragments, case-insensitive, whole words. A post counts when:
#   (a) an asking verb is followed by a role within ~2 words ("looking for a GTM consultant")
#       and a service is named in the start of the post, or
#   (b) an asking verb is followed by the service itself ("need a landing page"), or
#   (c) a service is followed by "needed" ("website developer needed").
# "Need a ride to the polls" matches none of these.
services:
  # websites
  - web ?sites?
  - landing pages?
  - webflow
  - wordpress
  - framer
  - web ?design(?:er)?
  - web ?developer
  - website developer
  # GTM
  - gtm
  - go[- ]to[- ]market
  - revops
  - rev ops
  - revenue operations
  - sales operations
  - sales process
  - hubspot
  - zoho crm
  - crm (?:setup|implementation|migration|consultant|admin|expert|cleanup|integration)
  - clay (?:tables?|workflows?|expert|consultant|enrichment|setup)
  - outbound (?:sales|marketing|campaigns?|prospecting|setup|system|agency|specialist|expert|lead gen\w*)
  - cold email
  - lead gen(?:eration)?
  - product marketing
  - positioning
  - sales automation
  - marketing automation
  - zapier
  - n8n
  - make\.com

# Asking verbs.
intent:
  - looking for
  - looking to hire
  - need(?:s|ed)?
  - seeking
  - want(?:s|ed)? to hire
  - hire
  - recommend(?:ations?)?(?:\s+for)?
  - anyone know
  - who can
  - can (?:anyone|someone) (?:recommend|help|build|set up)

# Who is being asked for.
roles:
  - some(?:one|body)
  - help
  - freelancers?
  - consultants?
  - agenc(?:y|ies)
  - experts?
  - developers?
  - designers?
  - specialists?
  - contractors?
  - partners?
  - builders?
  - engineers?
  - advisors?

# Skip people advertising themselves, job seekers and other noise (checked on the title).
exclude:
  - \[for hire\]
  - for hire
  - available for
  - hire me
  - offering
  - starting (?:at|from)
  - i(?:'m| am) (?:a|an) (?:freelance|freelancer|developer|designer|consultant)
  - i (?:build|help|offer|design|develop|made|built)
  - we (?:build|offer|help|made|built)
  - my services
  - dm me
  - open to work
  - free (?:audit|consult|consultation|website|trial|research)
  - show hn
  - co-?founder
  - early users
  - commission
  - sales reps?
  - bde
  - interns?(?:hip)?
  - roles?
  - opportunit(?:y|ies)
  - job
  - host(?:ing|ed)?
  - plugins?
  - domain names?
  - cpanel
  - seo
  - content
  - copy(?:writ\w*)?
  - writ(?:er|ing)
  - data entry
  - translat\w+
  - proofread\w*
  - looking for (?:a )?(?:work|clients?|projects?)

# Skip adverts and employers' own hiring posts. Checked on the title and the whole post.
# Real requests talk about "my / our" business; adverts talk to "your" business, quote
# prices, and end with "DM me" or "comment X below".
exclude_text:
  # talking to the reader
  - \byour (?:website|site|landing page)\b
  - \byour (?:business|brand|startup|company|store|shop|idea)
  - let'?s turn your
  - interested\?
  # prices and offers
  - starting (?:at|from|price)
  - starts? (?:at|from|@)
  - (?:just|only|@)\s*(?:₹|rs\.?|inr|\$|usd)\s*\d
  - (?:₹|rs\.?|inr)\s*\d[\d,]*\s*(?:/-|only|onwards)
  - we(?:'re| are) offering
  - our (?:services|packages|plans)
  - free (?:consultation|audit|quote|demo)
  - limited (?:slots|spots|time|seats)
  # calls to action
  - dm (?:me|us)
  - (?:message|inbox|ping|whatsapp|contact) (?:me|us)
  - hit me up
  - book a (?:free )?(?:call|demo|slot)
  - comment\s+[“"']?\w+[”"']?\s+(?:below|and i)
  - we can (?:build|design|develop|create|deliver|help you)
  - we(?:'re| are) (?:actively )?(?:hiring|looking to hire)
  - is hiring
  - join our team
  - apply now
  - open positions?
  - '#hiring'
  - '#opentowork'
  - full[- ]time
  - (?:they|he|she)(?:'re| are| is) hiring
  - hiring (?:a|an)\b
  - ask(?:s|ed)? me
  - do(?:es)? (?:i|you|my|your) (?:really )?need
  - what companies are really looking for
  - remote hiring
  - interns?(?:hips?)?

# Reddit's search feed, no key needed. All subreddits and all queries go into ONE
# search per run ("a OR b OR c"), because Reddit answers 429 to a second request
# from GitHub's servers. If it still blocks a run it shows as "couldn't check".
reddit:
  subreddits:
    - forhire
    - hiring
    - startups
    - SaaS
    - B2BSaaS
    - smallbusiness
    - Entrepreneur
    - indianstartups
    - IndiaStartups
    - sales
    - hubspot
    - webdev
  queries:
    - website
    - landing page
    - GTM
    - go-to-market
    - RevOps
    - HubSpot
    - lead generation
    - outbound
    - sales automation

# Hacker News posts and comments (free Algolia search).
hackernews:
  queries:
    - seeking freelancer
    - looking for freelancer
    - looking for a consultant
    - need help GTM
    - need help website

# Newly funded Indian startups, from Google News. These need GTM and a website soon.
funding:
  queries:
    - India startup raises seed funding
    - India startup raises pre-seed
    - India startup raises Series A
  max_per_run: 10

# Google search through Serper (SERPER_API_KEY, falls back to SerpApi's SERPAPI_KEY)
# for "looking for / seeking" posts on Reddit, X and LinkedIn. One search per
# platform per group of services: site:reddit.com (asks) (group). New posts can
# take hours to appear in Google, and X and LinkedIn are indexed patchily.
web_search:
  platforms: [reddit, x, linkedin]
  asks:
    - looking for
    - seeking
    - need a
    - need someone
    - recommend
    - anyone know
  groups:
    - [website, landing page, webflow, wordpress]
    - [GTM, go-to-market, RevOps, revenue operations]
    - [HubSpot, CRM, sales automation, marketing automation, n8n, zapier]
    - [outbound, cold email, lead generation, sales process, Clay]
  # Serper's free accounts return at most 10 results per search.
  results_per_query: 10
  # 3 platforms × 4 groups = 12 searches per run; this caps it to protect the quota.
  max_queries: 12
