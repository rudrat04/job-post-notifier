# Freelance leads: people and companies asking for a freelance or fractional GTM
# engineer or AI/automation builder (B2B, D2C, SMEs), in India or remote.
# Run with `npm run leads`; they are emailed separately from the job digest.

# Drop leads older than this many days. Runs are daily, and already-sent leads are
# remembered, so 2 days gives a safety margin without repeats.
max_age_days: 2

# For Reddit, Hacker News, forum, X and LinkedIn posts, a lead must be an EXPLICIT ask
# close to a service. Regex fragments, case-insensitive, whole words. An ask is explicit when
# it is in the first person ("we're looking for", "I need"), a question to the crowd ("can
# anyone recommend"), or a sentence that opens with the ask ("Looking for a…", "Need a…").
# A post counts when:
#   (a) an explicit ask is followed by a person within ~4 words ("looking for a GTM consultant")
#       and a service is named in the start of the post, or
#   (b) a service is followed by "needed" ("automation expert needed"), or
#   (c) an explicit ask is followed by "help" or the service ("need an n8n workflow") AND the
#       post mentions paying, a budget or hiring. Without that, it reads like a support question.
# Freelancer.com projects and posts tagged [hiring] only need to name a service.
services:
  # GTM
  - gtm
  - go[- ]to[- ]market
  - gtm engineer(?:ing)?
  - fractional (?:gtm|revops|growth|marketing|cmo|sales)
  - revops
  - rev ops
  - revenue operations
  - sales operations
  - sales process
  - sales automation
  - marketing automation
  - lead (?:gen(?:eration)?|management|routing|scoring|enrichment)
  - outbound (?:sales|marketing|campaigns?|prospecting|setup|system|engine|automation)
  - cold email (?:setup|system|infrastructure|automation|campaigns?)
  - clay
  - apollo
  - smartlead
  # CRM
  - hubspot
  - salesforce
  - zoho crm
  - pipedrive
  - close crm
  - crm (?:setup|implementation|migration|consultant|admin|expert|cleanup|integration|automation|workflows?)
  # automation and AI
  - n8n
  - make\.com
  - make scenarios?
  - make (?:freelancers?|experts?|developers?|consultants?|automation)
  - zapier
  - workflow automation
  - automations?
  - automate
  - ai (?:automation|agents?|workflows?|assistant|chatbot|voice agent|sdr|integration)
  - whatsapp (?:automation|bot|chatbot|api)
  - chatbot
  - airtable
  - retool

# First-person and crowd asks, which count anywhere in a post. A sentence that opens with
# "looking for", "seeking", "need", "hiring" or "wanted" also counts (built into the matcher).
# Bare "need" or "recommend" mid-sentence is left out on purpose: "every SaaS needs a RevOps
# expert" and "I recommend a consultant" are promotion, not asks.
intent:
  - (?:i|we)(?:'m|'re| am| are)? (?:currently |actively |urgently |now )?(?:looking for|seeking|searching for|trying to find|hoping to find)
  - (?:i|we)(?:'m|'re| am| are) (?:looking to |trying to )?hir(?:e|ing)
  - (?:i|we) (?:urgently |really |also )?need
  - (?:i|we)(?:'d| would) like to hire
  - (?:i|we) want to hire
  - looking to hire
  - (?:can|could) (?:anyone|someone|somebody) (?:recommend|suggest|help|build|set up)
  - any recommendations? for
  - (?:does )?any(?:one|body) know (?:a|an|any|of|someone|somebody)

# Who is being asked for.
roles:
  - some(?:one|body)
  - help
  - freelancers?
  - consultants?
  - contractors?
  - agenc(?:y|ies)
  - experts?
  - developers?
  - specialists?
  - builders?
  - engineers?
  - advisors?
  - partners?
  - fractional

# Skip people advertising themselves, job seekers and other noise (checked on the title).
exclude:
  - \[for hire\]
  - \[offer\]
  - ^hire (?:a|an|me)\b
  - for hire
  - available for
  - hire me
  - offering
  - starting (?:at|from)
  - i(?:'m| am) (?:a|an) (?:freelance|freelancer|developer|designer|consultant|expert|automation)
  - i (?:build|help|offer|design|develop|made|built|automate)
  - we (?:build|offer|help|made|built|automate)
  - my services
  - dm me
  - open to work
  - free (?:audit|consult|consultation|help|trial|research|workflows?|templates?|ai|automations?)
  - looking to build
  - show hn
  - co-?founder
  - early users
  - commission
  - referral
  - white[- ]label
  - revenue shar\w*
  - volunteer
  - ambassadors?
  - affiliate
  - sales reps?
  - bde
  - interns?(?:hip)?
  - tutorial
  - course
  - template
  - seo
  - copy(?:writ\w*)?
  - writ(?:er|ing)
  - data entry
  - translat\w+
  - looking for (?:a )?(?:work|clients?|projects?|job)
  - ^seeking work
  # content and announcements: titles only, since real asks use these words in passing
  - (?:top )?\d+ (?:steps|tips|ways|lessons|things|mistakes|tools)
  - (?:just|we) launched
  - podcast
  - survey
  - tired of
  - stop (?:wasting|losing)
  - hottest role

# Skip adverts and employers' full-time hiring posts. Checked on the title and the whole post.
# Real requests talk about "my / our" business; adverts talk to "your" business, quote
# prices, and end with "DM me" or "comment X below".
exclude_text:
  # talking to the reader
  - \byour (?:\w+ )?(?:business|brand|startup|company|store|shop|agency|team|workflows?|process(?:es)?|operations|sales|crm|leads|automations?|scenarios?|stack|tools?)\b
  - i can (?:help|build|set up|fix|automate)
  - let'?s turn your
  - interested\?
  # prices and offers
  - starting (?:at|from|price)
  - starts? (?:at|from|@)
  - (?:just|only|@)\s*(?:₹|rs\.?|inr|\$|usd)\s*\d
  - (?:₹|rs\.?|inr)\s*\d[\d,]*\s*(?:/-|only|onwards)
  - we(?:'re| are) offering
  - our (?:services|packages|plans|agency)
  - free (?:consultation|audit|quote|demo|trial)
  - limited (?:slots|spots|time|seats)
  # calls to action
  - dm (?:me|us)
  - (?:message|inbox|ping|whatsapp|contact) (?:me|us)
  - hit me up
  - book a (?:free )?(?:call|demo|slot)
  - comment\s+[“"']?\w+[”"']?\s+(?:below|and i)
  - we can (?:build|design|develop|create|deliver|help you|automate)
  # full-time employment, not freelance
  - full[- ]time
  - join our team
  - long[- ]term team member
  - apply now
  - open positions?
  - salary
  - '#opentowork'
  - '#(?:now)?hiring'
  - jobs section
  - (?:great|exciting) opportunity to join
  - to join (?:the|our) [\w ]{0,30}team
  - build (?:&|and) sell
  - (?:they|he|she|we)(?:'re| are| is) hiring
  - ask(?:s|ed)? me
  - do(?:es)? (?:i|you|my|your) (?:really )?need
  - interns?(?:hips?)?
  # job seekers
  - (?:looking for|seeking|searching for) (?:(?:a|new|more|freelance|remote|paid|part[- ]time|full[- ]time|my next|next|any)\s+){0,2}(?:work|clients?|projects?|jobs?|gigs?|opportunit\w+|roles?|positions?|openings?)
  - open to (?:new |freelance |remote )?(?:work|opportunit\w+|roles?|projects?|offers?)
  - available for (?:work|hire|freelance|projects?|new)
  - hire me
  - my (?:resume|cv|portfolio)
  - how (?:do|can) i (?:get|break) into
  - i'?d love to (?:be considered|join|work with|work on)
  - (?:i'?m|i am) based in
  - (?:i|i'?ve|i have) (?:got )?(?:over |more than )?\d+\+? years
  # surveys and partnership hunts
  - \[academic\]
  - business partner
  - business development
  - client acquisition
  # promotion and content
  - (?:i|we) help (?:\w+ ){0,2}(?:founders|businesses|brands|startups|companies|teams|agencies|clients|b2b|saas|d2c|coaches)
  - helping (?:\w+ ){0,2}(?:founders|businesses|brands|startups|companies|teams|agencies)
  - (?:i|we)(?:'ve| have) helped
  - i will (?:build|help|set up|create|design|automate)
  - how (?:i|we) (?:built|build|helped|automated|got|scaled|grew)
  - excited to (?:announce|share|launch)
  - link in (?:bio|comments?)
  - look no further
  - (?:we|i)(?:'ve| have) got you
  - beta testers?
  - early (?:access|adopters|testers)
  - waitlist
  - to test (?:a|an|our|my)
  - fellow builders
  - here'?s (?:how|why)
  - (?:equity[- ](?:based|only)|for equity|sweat equity)
  - (?:looking for|seeking|need) (?:an? )?(?:investors?|funding|angel)
  - to collaborate on
  - alternatives? (?:to|for)

# Reddit search over several subreddits at once. Without a Reddit app key this uses
# the public RSS feed, which Reddit often blocks from GitHub's servers; set
# REDDIT_CLIENT_ID and REDDIT_CLIENT_SECRET (a free "script" app) for reliable access.
reddit:
  subreddits:
    - forhire
    - hiring
    - slavelabour
    - startups
    - SaaS
    - B2BSaaS
    - smallbusiness
    - Entrepreneur
    - indianstartups
    - IndiaStartups
    - ecommerce
    - shopify
    - DTC
    - sales
    - b2bmarketing
    - hubspot
    - salesforce
    - n8n
    - zapier
    - automation
    - nocode
    - ClayGTM
  queries:
    - GTM
    - go-to-market
    - RevOps
    - HubSpot
    - CRM
    - lead generation
    - outbound
    - automation
    - n8n
    - Zapier
    - Make.com
    - Clay
    - AI agent
    - fractional
  # All queries go into one "a OR b OR c" search, as Reddit blocks a second request.
  queries_per_search: 14

# Hacker News posts and comments (free Algolia search).
hackernews:
  queries:
    - seeking freelancer
    - looking for freelancer
    - looking for a consultant
    - fractional GTM
    - automation freelancer
    - n8n

# Discourse forums' hiring sections. Every post there is a request or an advert, so
# a post only needs to name a service and pass the excludes above.
forums:
  - name: n8n community
    url: https://community.n8n.io/c/jobs/13
  - name: Make community
    url: https://community.make.com/c/hire-a-pro/50

# Google search through Serper (SERPER_API_KEY, falls back to SerpApi's SERPAPI_KEY)
# for "looking for / seeking" posts on Reddit, X and LinkedIn. Skipped without a key.
# One search per platform per group of services. X is left out: Google's X results
# were mostly noise. Serper's free 2,500 searches are a one-off allowance: 6 a day
# lasts about a year.
web_search:
  platforms: [linkedin, reddit]
  # First-person asks only: bare "recommend" or "need a" pulled in mostly promotion.
  asks:
    - looking for a
    - looking to hire
    - we're looking for
    - need someone
    - can anyone recommend
    - hiring a freelance
  groups:
    - [fractional GTM, GTM engineer, RevOps, revenue operations]
    - [n8n, Zapier, Make.com, workflow automation, AI automation]
    - [HubSpot, CRM, Clay, outbound, lead generation]
  results_per_query: 10
  max_queries: 6
