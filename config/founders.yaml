# Founders to cold DM: freshly funded Indian startups missing at least one of the role
# groups below (GTM, Founder's Office, Product Marketing) on LinkedIn. Run with `npm run founders`; emailed separately from everything else.
#
# How it works: Google News funding stories give company names (free). For each company:
#   0. Exa company search gets the headcount; companies over `max_employees` are skipped.
#   1. Exa people search (EXA_API_KEY) finds the founders from LinkedIn work history.
#   2. A second Exa search looks for anyone currently at the company in the role groups.
#   3. For each group still empty, People Data Labs (PDL_API_KEY) gets asked. That's free when
#      PDL finds nobody, but its data lags LinkedIn by months, so it only ever fills a group.
#   4. One Google (Serper) search double-checks the groups still empty.
# Without an Exa key, Google does steps 1 and 2 instead. Companies with founders and at least
# one empty group are emailed. "No one found" is a strong hint, not proof: glance at the
# company's People tab before you DM.

# Funding stories from Google News.
news:
  queries:
    - India startup raises seed funding
    - India startup raises pre-seed
    - India startup raises Series A
    - India SaaS startup raises funding
    - India D2C brand raises funding
    - India AI startup raises funding
  # Look back this many days. Companies already checked are remembered, so overlap is free.
  days: 7
  # Headlines must match one of these to count as a funding round (regex, case-insensitive).
  keywords: [rais, funding, seed, 'series [a-c]', pre-series]
  # Headlines matching any of these are dropped: roundups and investors' own funds. Whole words.
  exclude: [roundup, round-up, weekly, this week, funding wrap, fund, first close, venture capital firm, startups raised, startups raise]

# The roles to look for, in groups. A company is emailed when ANY group has no one in it,
# and the email says which groups are missing. Titles are matched loosely ("Founder's
# Office" also matches "Founders Office" and "founder’s office"). Within a group, most
# important first: Google reads only about 32 words, so its search uses the first ones that fit.
role_groups:
  GTM:
    - GTM Engineer
    - GTM Lead
    - Head of GTM
    - Go-to-Market Engineer
    - GTM Engineering
  Founder's Office:
    - Founder's Office
    - Chief of Staff
    - Founder's Associate
    - CEO's Office
    - Founders Office
    - Founders Associate
    - Associate to the Founder
    - Associate to Founder
    - Founder/CEO Office
    - Office of the CEO
  Product Marketing:
    - Product Marketing
    - Product Marketing Manager
    - Product Marketing Lead
    - Head of Product Marketing

# Founders listed per company (co-founders included; the CEO counts too).
max_founders_per_company: 3

# Skip companies with more people than this. Headcount comes from Exa's company search
# (one search per company, done first so big companies cost nothing more). Companies Exa
# has no headcount for are kept and marked "size unknown"; early startups often have none.
max_employees: 50

# Companies checked per run; the rest wait for the next run.
max_companies: 20

# Searches per run, at most, by provider. About 3 Exa per company (size, founders, roles).
#   exa:    ~$0.007 each; the free tier's monthly credit covers well over 1,000.
#   google: Serper: about one per company (founders Exa missed, and the double-check), or
#           two per company without an Exa key. Its free 2,500 are a one-off allowance
#           shared with the freelance leads.
#   pdl:    one per empty group; free when nobody's found, 1 credit when someone is.
#           The free plan allows 10 a minute, so the run waits between calls.
# Dry runs spend searches too.
limits:
  exa: 60
  google: 30
  pdl: 45
