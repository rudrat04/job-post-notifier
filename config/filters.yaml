# Every entry is a case-insensitive regex fragment, matched as a whole word or phrase.
# Tuned for ~2 years of experience: GTM engineering, GTM strategy, product marketing,
# RevOps, sales-process/automation roles, chief of staff and founder's office.

# A job title matching ANY of these is kept.
titles:
  # Chief of staff / founder's office
  - chief of staff
  - founder'?s'? office
  - office of (?:the )?(?:founders?|ceo)
  - founder'?s'? associate
  - founding associate
  - associate to (?:the )?(?:founders?|ceo)
  - special projects
  # GTM
  - gtm
  - go[- ]to[- ]market
  # Product marketing
  - product marketing
  - pmm
  # Revenue / sales / marketing operations
  - rev ?ops
  - revenue (?:operations|ops)
  - sales (?:operations|ops|enablement|systems|process(?:es)?|automation)
  - marketing (?:operations|ops|automation)
  - business (?:operations|ops)
  - strategy (?:&|and) operations
  - crm (?:manager|specialist|administrator|admin|lead|analyst)

# Mix-and-match: a title is kept when it has a word from EVERY group in a combo,
# in any order ("Growth Operations Manager", "Operations Manager, Revenue").
title_combos:
  # revenue/sales/marketing/growth + operations-style word
  - - [revenue, sales, marketing, growth, gtm, crm, hubspot, salesforce, outbound, lead gen(?:eration)?, demand gen(?:eration)?]
    - [operations, ops, systems, architect, automation, enablement, process(?:es)?, infrastructure]
  # builder-style GTM roles: "Growth Engineer", "Marketing Engineer", "Automation Engineer"
  - - [growth, revenue, marketing, sales, automation, workflow, crm, no.?code, low.?code, clay]
    - [engineer]
  # strategy-flavoured business roles
  - - [strategy, strategic]
    - [associate, operations, ops, partner, projects, initiatives]
  # CRM / outbound tooling owners
  - - [hubspot, salesforce, crm, outbound, apollo, clay]
    - [manager, specialist, lead, architect, owner, consultant, associate, analyst]
  # consultants: "Marketing Consultant", "GTM Consultant", "AI Automation Consultant"
  - - [marketing, gtm, "go[- ]to[- ]market", ai, workflow, automation]
    - [consultants?]

# Drop a job if its title matches any of these.
exclude_title:
  - intern(?:ship)?
  - trainee
  - assistant
  # too senior for ~2 years
  - senior
  - sr\.?
  - principal
  - staff (?:engineer|product|software|data|designer|manager)
  - head of
  - director
  - vp
  - vice president
  - avp
  - svp
  - evp
  # engineering / non-GTM technical roles
  - software
  - sdet
  - data (?:engineer|scientist)
  - machine learning
  - ml
  - back[- ]?end
  - front[- ]?end
  - full[- ]?stack
  - devops
  - sre
  - qa
  - security
  - site reliability
  - mechanical
  - electrical
  - civil
  # HR, finance and sales-floor roles that share a keyword
  - hr
  - human resources
  - recruit(?:er|ing|ment)?
  - talent
  - career fair
  - fp&a
  - finance
  - accountant
  - inside sales
  - technical marketing
  - ^engineer[\s\-–,]+(?:inside\s+)?sales
  # pre-sales / support engineering
  - sales engineer
  - solutions? engineer
  - support engineer
  - customer support
  - developer
  - designer

# Drop a job if its description matches any of these (keep this list short).
exclude_description: []

# Drop jobs asking for more than this many years of experience (0 = off). Read from
# the description ("5+ years", "4-6 years") and from Naukri links ("8-to-13-years").
# A range counts by its lower end, so "2-5 years" still passes at 3.
max_experience_years: 3

# If set, the title or description must mention at least one of these.
include_keywords: []

# Only keep jobs posted within the last N days (0 = no limit). Dates come from the
# job board; Workable only gives a calendar date, so it can lag by up to a day.
max_age_days: 2
# Some boards publish no posting date; keep those anyway?
keep_undated: true

locations:
  # On-site or hybrid jobs in these places are always kept.
  cities:
    - mumbai
    - bombay
    - navi mumbai
    - thane
    - bengaluru
    - bangalore
    - bengalooru
    - pune
    - ahmedabad
    - amdavad
    - gandhinagar
  # Remote jobs limited to these regions are kept.
  remote_regions:
    - india
    - apac
    - asia
    - ist
  # Keep remote jobs that name no country at all ("Remote", "Anywhere").
  remote_anywhere: true
  # Keep jobs with no location listed; they're flagged in the email.
  keep_missing: true
