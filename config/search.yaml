# Keyword search across job sites, so you don't need a list of companies.
# Every source is queried with these keywords; results then go through the
# title, location, experience and age filters in filters.yaml.
queries:
  - gtm
  - gtm engineer
  - revenue operations
  - revops
  - sales operations
  - sales enablement
  - sales process
  - marketing operations
  - marketing automation
  - product marketing
  - growth operations
  - business operations
  - strategy and operations
  - chief of staff
  - founders office
  - founder's associate
  - hubspot
  - crm
  - marketing consultant
  - gtm consultant
  - ai consultant
  - automation consultant
  - fractional
  - freelance gtm
  - freelance automation

# Free, no key. Covers every company hiring through Workable.
workable:
  locations: [India]

# RapidAPI key (JSearch) → RAPIDAPI_KEY. The Basic plan allows 200 requests a month.
# Each run uses at most max_requests (2 runs a day × 31 days × 3 = 186/month) and
# rotates through the query × place pairs below, so every pair gets its turn.
# Dry runs and bootstrap runs skip JSearch, and failed requests are not retried.
jsearch:
  queries:
    - gtm engineer
    - revenue operations
    - chief of staff
    - founders office
    - product marketing
    - gtm consultant
    - automation consultant
  where: [India]
  max_requests: 3

# Scrapes LinkedIn, Naukri and Indeed with the open-source JobSpy CLI
# (pip install python-jobspy==1.4.0). Skipped if it isn't installed. Those sites
# forbid scraping and may block GitHub's servers; a blocked site is reported
# under "couldn't check" and the rest of the run carries on.
jobspy:
  sites: [linkedin, naukri, indeed]
  queries:
    - gtm
    - gtm engineer
    - revenue operations
    - sales operations
    - marketing operations
    - product marketing
    - chief of staff
    - founders office
  where: [Mumbai, Bengaluru, Pune, Ahmedabad, Gandhinagar]
  remote_india: true
  results_per_site: 20
