# Keyword search across job sites, so you don't need a list of companies.
# Every source is queried with these keywords; results then go through the
# title, location, experience and age filters in filters.yaml.
queries:
  - gtm
  - gtm engineer
  - revenue operations
  - revops
  - sales operations
  - sales enablement
  - sales process
  - marketing operations
  - marketing automation
  - product marketing
  - growth operations
  - business operations
  - strategy and operations
  - chief of staff
  - founders office
  - founder's associate
  - hubspot
  - crm

# Free, no key. Covers every company hiring through Workable.
workable:
  locations: [India]

# Free key from developer.adzuna.com → ADZUNA_APP_ID, ADZUNA_APP_KEY.
# Aggregates many Indian job sites. "India" catches remote roles.
adzuna:
  where: [Mumbai, Bengaluru, Pune, Ahmedabad, Gandhinagar, India]

# Free key from jooble.org/api/about → JOOBLE_API_KEY.
jooble:
  where: [Mumbai, Bengaluru, Pune, Ahmedabad, Gandhinagar, India]

# RapidAPI key (JSearch) → RAPIDAPI_KEY. The free tier is ~200 requests a month,
# so only a few high-value queries, capped per run (2 runs a day × 3 ≈ 180/month).
jsearch:
  queries:
    - gtm engineer
    - revenue operations
    - chief of staff
    - founders office
    - product marketing
  where: [India]
  max_requests: 3

# Scrapes LinkedIn, Naukri and Indeed with the open-source JobSpy CLI
# (pip install python-jobspy==1.4.0). Skipped if it isn't installed. Those sites
# forbid scraping and may block GitHub's servers; a blocked site is reported
# under "couldn't check" and the rest of the run carries on.
jobspy:
  sites: [linkedin, naukri, indeed]
  queries:
    - gtm
    - gtm engineer
    - revenue operations
    - sales operations
    - marketing operations
    - product marketing
    - chief of staff
    - founders office
  where: [Mumbai, Bengaluru, Pune, Ahmedabad, Gandhinagar]
  remote_india: true
  results_per_site: 20
