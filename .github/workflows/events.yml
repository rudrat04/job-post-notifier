name: Free events

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options: [normal, dry-run, bootstrap]
        default: normal

concurrency:
  group: free-events
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          MODE: ${{ inputs.mode || 'normal' }}
        run: |
          case "$MODE" in
            dry-run)   npx tsx src/events/index.ts --dry-run ;;
            bootstrap) npx tsx src/events/index.ts --bootstrap ;;
            *)         npx tsx src/events/index.ts ;;
          esac
